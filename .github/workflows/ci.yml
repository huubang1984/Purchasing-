name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  t0:
    name: T0 — cổng tĩnh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Ranh gioi kien truc
        run: pnpm depcruise
      - name: Quet bi mat
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Audit phu thuoc (cong chan)
        # Chi xet prod dependencies. Hien S0 chua co prod dependency nao nen buoc nay
        # luon sach; se co rang that tu Task 3 tro di khi `pg` duoc them vao.
        run: pnpm audit --prod --audit-level high
      - name: Audit phu thuoc (bao cao, khong chan)
        # Hai advisory chan o day (vitest critical, vite high) deu thuoc devDependency
        # va chi khai thac duoc qua mot may chu ma du an nay khong bao gio khoi dong
        # (`vitest --ui`, may chu dev cua vite). Buoc nay khong chan CI, chi de log
        # lai advisory chu khong giau di. Neu ve sau du an that su chay mot trong hai
        # may chu do thi phai nang vitest len >=3.2.6 va gop lai thanh mot cong chan
        # duy nhat.
        run: pnpm audit --audit-level high
        continue-on-error: true

  t1-t2:
    name: T1+T2 — unit va contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  t3:
    name: T3 — integration voi Postgres that
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:int

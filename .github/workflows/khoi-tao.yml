name: Khoi tao to chuc — prod (bam tay)

# =============================================================================================
# [S1.9103 / ADR-111] TAO TO CHUC, NGUOI DUNG VA VAI TREN PROD: BAM TAY, NGUOI KHAC DUYET, XOA BAN KHAI
# =============================================================================================
# Chi `workflow_dispatch` tren `master`. Hai job:
#
#   build   KHONG co quyen AWS nao. Kiem dau vao TRUOC (sai dang thi dung, khong build), in BANG
#           nguoi duyet duyet vao tom tat cua run, roi `docker build` dich `khoi-tao` va giao image
#           duoi dang artifact — cung ranh gioi voi `deploy.yml` (ADR-067).
#   chay    environment `prod-khoi-tao` (Required reviewers + Prevent self-review: nguoi bam KHONG tu
#           duyet duoc), role `tp-deploy`: day image, dang ky task definition `tp-khoi-tao`, chay task
#           MOT LAN voi dung dau vao da duyet; task thoat 0 thi XOA bi mat ban khai (khong cua so khoi
#           phuc) va in dong ket qua (ma to chuc, so nguoi, so vai). Task hong thi bi mat CON, de sua
#           va chay lai voi phien ban moi.
#
# Nguoi duyet KHONG doc duoc ban khai (email, ho ten). Ho duyet dung bang cua job `build`: ten va
# PHIEN BAN (VersionId) cua bi mat, to chuc, so nguoi, so vai. Mot phien ban cua Secrets Manager
# khong doi noi dung duoc; cong cu doc DUNG phien ban ay va dung TRUOC khi cham CSDL neu ban khai
# khong khop ba ky vong. Them nguoi sau luc duyet = phien ban moi = mot lan chay va mot lan duyet moi.
#
# Dau vao di qua `env:` — KHONG noi suy `${{ inputs.* }}` vao `run:`. `concurrency` dung CHUNG nhom
# voi `deploy.yml`: task khoi tao khong chay cung luc migrate (hardening thu hoi roi cap lai quyen cua
# app_khoi_tao). Cac buoc AWS nam o `deploy/trien-khai.sh`.
# =============================================================================================

on:
  workflow_dispatch:
    inputs:
      che_do:
        description: "tao (to chuc moi) hay them-nguoi (to chuc da co)"
        type: choice
        options: [tao, them-nguoi]
        default: tao
      bi_mat:
        description: "Ten bi mat ban khai, duoi tp/khoi-tao/ban-khai/"
        type: string
        required: true
      phien_ban:
        description: "VersionId cua bi mat (create-secret / put-secret-value in ra)"
        type: string
        required: true
      to_chuc:
        description: "tao: slug cua to chuc moi; them-nguoi: ma (UUID) cua to chuc da co"
        type: string
        required: true
      so_nguoi:
        description: "So nguoi trong ban khai"
        type: string
        required: true
      so_vai:
        description: "Tong so cap nguoi-vai trong ban khai"
        type: string
        required: true

permissions: {}

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  build:
    name: Kiem dau vao, build image (khong quyen AWS)
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Kiem dau vao, in bang nguoi duyet duyet
        env:
          CHE_DO: ${{ inputs.che_do }}
          BI_MAT: ${{ inputs.bi_mat }}
          PHIEN_BAN: ${{ inputs.phien_ban }}
          TO_CHUC: ${{ inputs.to_chuc }}
          SO_NGUOI: ${{ inputs.so_nguoi }}
          SO_VAI: ${{ inputs.so_vai }}
        run: bash deploy/trien-khai.sh kiem-khoi-tao >> "$GITHUB_STEP_SUMMARY"
      - name: Build image khoi-tao
        run: |
          set -euo pipefail
          mkdir -p anh
          docker build -f deploy/Dockerfile --target khoi-tao -t tp-khoi-tao:ci .
          docker save tp-khoi-tao:ci | gzip -1 > anh/khoi-tao.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: anh-khoi-tao
          path: anh/
          retention-days: 1
          if-no-files-found: error

  chay:
    name: Chay tp-khoi-tao, xoa ban khai (tp-deploy, prod-khoi-tao)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: prod-khoi-tao
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-southeast-1
      TAI_KHOAN: "942091277863"
      CLUSTER: tp-prod
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: anh-khoi-tao
          path: anh
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: arn:aws:iam::942091277863:role/tp-deploy
          role-session-name: khoi-tao-${{ github.run_id }}
          aws-region: ap-southeast-1
      - name: Dang nhap ECR
        run: aws ecr get-login-password | docker login --username AWS --password-stdin "$TAI_KHOAN.dkr.ecr.$AWS_REGION.amazonaws.com"
      - name: Day image, chay task khoi tao, xoa ban khai
        env:
          SUBNETS: ${{ vars.TP_SUBNETS_UNG_DUNG }}
          SG_KHOI_TAO: ${{ vars.TP_SG_KHOI_TAO }}
          THE: ${{ github.sha }}
          CHE_DO: ${{ inputs.che_do }}
          BI_MAT: ${{ inputs.bi_mat }}
          PHIEN_BAN: ${{ inputs.phien_ban }}
          TO_CHUC: ${{ inputs.to_chuc }}
          SO_NGUOI: ${{ inputs.so_nguoi }}
          SO_VAI: ${{ inputs.so_vai }}
        run: |
          set -euo pipefail
          anh_kt=$(bash deploy/trien-khai.sh day anh/khoi-tao.tar.gz tp-khoi-tao "$THE")
          td_kt=$(bash deploy/trien-khai.sh dang-ky tp-khoi-tao "$anh_kt" tp-khoi-tao)
          echo "- task definition: \`$td_kt\`" >> "$GITHUB_STEP_SUMMARY"
          bash deploy/trien-khai.sh khoi-tao "$td_kt" | tee -a "$GITHUB_STEP_SUMMARY"

name: Khoi tao to chuc — prod (bam tay)

# =============================================================================================
# [S1.9103 / ADR-111] TAO TO CHUC, NGUOI DUNG VA VAI TREN PROD: BAM TAY, NGUOI KHAC DUYET, XOA BAN KHAI
# =============================================================================================
# Chi `workflow_dispatch` tren `master`. Ba job:
#
#   build   KHONG co quyen AWS nao. Kiem dau vao va NGUOI BAM (bot thi dung) TRUOC; voi `tao`, chon
#           ma to chuc (UUIDv4) ngay tai day; in BANG nguoi duyet duyet vao tom tat cua run; roi
#           `docker build` dich `khoi-tao` va giao image duoi dang artifact — cung ranh gioi voi
#           `deploy.yml` (ADR-067).
#   chay    environment `prod-khoi-tao` (Required reviewers + Prevent self-review, tat "admin bypass").
#           Buoc DAU, truoc khi lay quyen AWS: lich su duyet cua run phai co mot NGUOI khac nguoi bam
#           duyet `prod-khoi-tao` — kiem KET QUA cua cai dat, khong tin cai dat. Roi role `tp-deploy`:
#           day image, dang ky `tp-khoi-tao` (ghim hinh dang container), chay task MOT LAN voi dung dau
#           vao da duyet; thoat 0 thi XOA bi mat ban khai (khong cua so khoi phuc) va in ket qua suy tu
#           dau vao. Task hong thi bi mat CON.
#   nhac    KHONG quyen nao. `chay` khong xanh (hong, bi tu choi, bi huy, het han artifact) thi bi mat
#           mang du lieu ca nhan CON — job nay noi ra dieu ay trong tom tat cua run.
#
# Workflow khong cho nguoi duyet xem ban khai (email, ho ten). Ho duyet dung bang cua job `build`: ten,
# PHIEN BAN va BAM SHA-256 cua bi mat, ma to chuc, so nguoi, so nguoi theo tung ma vai, ai bam. Cong
# cu doc DUNG phien ban ay, so bam, va dung TRUOC khi cham CSDL neu ban khai lech.
#
# Dau vao di qua `env:` — KHONG noi suy `${{ inputs.* }}` vao `run:`. `concurrency` RIENG: mot lan
# khoi tao cho duyet (toi 30 ngay) khong chan hotfix cua `deploy.yml`. Kho la kho CONG KHAI: moi dau
# vao va tom tat cua run ai cung doc duoc — ADR-111. Cac buoc AWS nam o `deploy/trien-khai.sh`.
# =============================================================================================

on:
  workflow_dispatch:
    inputs:
      che_do:
        description: "tao (to chuc moi) hay them-nguoi (to chuc da co)"
        type: choice
        options: [tao, them-nguoi]
        default: tao
      bi_mat:
        description: "Ten bi mat ban khai: tp/khoi-tao/ban-khai/<slug>"
        type: string
        required: true
      phien_ban:
        description: "VersionId cua bi mat (create-secret / put-secret-value in ra)"
        type: string
        required: true
      bam:
        description: "SHA-256 cua tep ban khai, 64 ky tu hex chu thuong"
        type: string
        required: true
      to_chuc:
        description: "tao: slug cua to chuc moi; them-nguoi: ma (UUID) cua to chuc da co"
        type: string
        required: true
      so_nguoi:
        description: "So nguoi trong ban khai"
        type: string
        required: true
      vai:
        description: "So nguoi theo tung ma vai, vd BUYER=1,PROCUREMENT_MANAGER=2,DIRECTOR=1"
        type: string
        required: true

permissions: {}

concurrency:
  group: khoi-tao-prod
  cancel-in-progress: false

jobs:
  build:
    name: Kiem dau vao, build image (khong quyen AWS)
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      ma_to_chuc: ${{ steps.chon.outputs.ma_to_chuc }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Chon ma to chuc (tao)
        id: chon
        env:
          CHE_DO: ${{ inputs.che_do }}
        run: |
          set -euo pipefail
          ma=""
          if [ "$CHE_DO" = tao ]; then ma=$(cat /proc/sys/kernel/random/uuid); fi
          echo "ma_to_chuc=$ma" >> "$GITHUB_OUTPUT"
      - name: Kiem dau vao va nguoi bam, in bang nguoi duyet duyet
        env:
          CHE_DO: ${{ inputs.che_do }}
          BI_MAT: ${{ inputs.bi_mat }}
          PHIEN_BAN: ${{ inputs.phien_ban }}
          BAM: ${{ inputs.bam }}
          TO_CHUC: ${{ inputs.to_chuc }}
          SO_NGUOI: ${{ inputs.so_nguoi }}
          VAI: ${{ inputs.vai }}
          MA_TO_CHUC: ${{ steps.chon.outputs.ma_to_chuc }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: bash deploy/trien-khai.sh kiem-khoi-tao >> "$GITHUB_STEP_SUMMARY"
      - name: Build image khoi-tao
        run: |
          set -euo pipefail
          mkdir -p anh
          docker build -f deploy/Dockerfile --target khoi-tao -t tp-khoi-tao:ci .
          docker save tp-khoi-tao:ci | gzip -1 > anh/khoi-tao.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: anh-khoi-tao
          path: anh/
          # Nguoi duyet co the duyet cham hon mot ngay; artifact chi mang image (ma cua kho), khong bi mat.
          retention-days: 7
          if-no-files-found: error

  chay:
    name: Chay tp-khoi-tao, xoa ban khai (tp-deploy, prod-khoi-tao)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: prod-khoi-tao
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      AWS_REGION: ap-southeast-1
      TAI_KHOAN: "942091277863"
      CLUSTER: tp-prod
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Kiem nguoi duyet (truoc khi lay quyen AWS)
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" > "$RUNNER_TEMP/duyet.json"
          bash deploy/trien-khai.sh kiem-nguoi-duyet "$RUNNER_TEMP/duyet.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: anh-khoi-tao
          path: anh
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: arn:aws:iam::942091277863:role/tp-deploy
          role-session-name: khoi-tao-${{ github.run_id }}
          aws-region: ap-southeast-1
      - name: Dang nhap ECR
        run: aws ecr get-login-password | docker login --username AWS --password-stdin "$TAI_KHOAN.dkr.ecr.$AWS_REGION.amazonaws.com"
      - name: Day image, chay task khoi tao, xoa ban khai
        env:
          SUBNETS: ${{ vars.TP_SUBNETS_UNG_DUNG }}
          SG_KHOI_TAO: ${{ vars.TP_SG_KHOI_TAO }}
          THE: ${{ github.sha }}
          CHE_DO: ${{ inputs.che_do }}
          BI_MAT: ${{ inputs.bi_mat }}
          PHIEN_BAN: ${{ inputs.phien_ban }}
          BAM: ${{ inputs.bam }}
          TO_CHUC: ${{ inputs.to_chuc }}
          SO_NGUOI: ${{ inputs.so_nguoi }}
          VAI: ${{ inputs.vai }}
          MA_TO_CHUC: ${{ needs.build.outputs.ma_to_chuc }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          anh_kt=$(bash deploy/trien-khai.sh day anh/khoi-tao.tar.gz tp-khoi-tao "$THE")
          td_kt=$(bash deploy/trien-khai.sh dang-ky tp-khoi-tao "$anh_kt" tp-khoi-tao)
          echo "- task definition: \`$td_kt\`" >> "$GITHUB_STEP_SUMMARY"
          bash deploy/trien-khai.sh khoi-tao "$td_kt" | tee -a "$GITHUB_STEP_SUMMARY"

  nhac:
    name: Nhac bi mat ban khai con (chay khong xanh)
    needs: [build, chay]
    if: always() && needs.build.result == 'success' && needs.chay.result != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Nhac xoa hay chay lai
        env:
          BI_MAT: ${{ inputs.bi_mat }}
          KET_QUA: ${{ needs.chay.result }}
        run: |
          {
            echo "### Khởi tạo tổ chức — bí mật bản khai CÒN"
            echo ""
            echo "Job \`chay\` kết thúc \`$KET_QUA\` (hỏng, bị từ chối, bị huỷ, hay không chạy): bí mật \`$BI_MAT\` — mang email và họ tên — CHƯA bị xoá."
            echo "Chạy lại (một lần duyệt mới), hay xoá tay: \`aws secretsmanager delete-secret --secret-id $BI_MAT --force-delete-without-recovery\`."
          } >> "$GITHUB_STEP_SUMMARY"

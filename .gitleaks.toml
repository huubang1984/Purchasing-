# ==============================================================================================
# CAU HINH GITLEAKS CHO BUOC "Quet bi mat" TRONG JOB T0 (.github/workflows/ci.yml)
# ==============================================================================================
# [S1.43, sau khi mo PR #41] Luat mac dinh `generic-api-key` doc hai dong khai bang tenant trong
# `db/migrations/hardening.always.sql` (`BANG_TENANT_KHAI`, ADR-037) thanh bi mat:
#
#   ('public', 'rfq_key_material',  '017_rfq_key_material'),
#   ('public', 'user_login_tokens', '029_dang_nhap_nguoi_mua'),
#
# Ten bang mang chu `key`/`token`; gia tri ke ben la TEN TEP migration khai sinh — khong phai bi mat.
# `pnpm t0` cuc bo KHONG chay gitleaks (khong cai tai cho), nen xanh cuc bo khong noi gi ve buoc nay:
# buoc nay chi do duoc bang chinh luot CI.
#
# Sua o cau hinh, khong sua SQL. Giu TOAN BO luat mac dinh; chi mien phan-bi-coi-la-bi-mat khi no
# co dung HINH DANG ten tep migration cua du an (`NNN_ten_khong_dau`): ~~ba chu so~~ [S1.9110 / khoan
# 284] ba HOAC BON chu so, gach duoi, chu thuong/so/gach duoi. Khong mien tep, khong mien luat, khong
# mien theo commit — mot khoa API that khong co hinh dang nay.
#
# [S1.9110 / khoan 284] Vi sao bon chu so: ADR-090 cho migration cua mot lo mang so tam `95NN_ten`
# toi luc `pnpm cap-so` cap so that o merge. Mot dong `BANG_TENANT_KHAI` mang so tam cho mot bang co
# chu `key`/`token` trong ten se lam job `t0c-bi-mat` do TREN NHANH lo — truoc khi cap-so doi so —
# neu regex chi nhan ba chu so. `db/hardening-hang.ts`, `rls-coverage` va `migration-shape` da nhan
# `\d{3,4}_`; cong `tests/architecture/hinh-dang-gitleaks.test.ts` ghim mau `1234_bang_key` (khop)
# canh nam mau hinh khoa (khong khop). Van neo hai dau; nam chu so tro len khong khop.

title = "TrustProcure — gitleaks"

[extend]
useDefault = true

[allowlist]
description = "Ten tep migration (NNN_ten, so tam NNNN_ten) trong BANG_TENANT_KHAI khong phai bi mat"
regexTarget = "secret"
regexes = [
  '''^\d{3,4}_[a-z0-9_]{1,60}$''',
]
